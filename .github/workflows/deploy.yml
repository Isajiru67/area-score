# main に push したら静的サイトをビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ローカルと同じ npm 11 に揃える（npm 10 だと package-lock.json を読めず npm ci が失敗する）
          cache: npm
      - run: npm ci
      # https://isajiru67.github.io/area-score/ で公開するのでサブパスを指定
      - run: npm run build
        env:
          BASE_PATH: /area-score
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
